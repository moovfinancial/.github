name: SOD PR Monitor — CC8.1 Change Management

# Runs daily at 8am CT (13:00 UTC) and checks PRs merged to production
# branches in the last 24 hours. Reports unapproved merges to Slack.
# Also triggers on any PR merge to production branches in real time.

on:
  schedule:
    - cron: '0 13 * * *'  # 8:00 AM CT (UTC-5) / 8:00 AM CDT (UTC-6 = 14:00 UTC, adjust for DST)
  pull_request:
    types: [closed]
    branches:
      - main
      - master
      - production
      - release/**

jobs:
  sod-check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read

    steps:
      - name: Check for unapproved merged PRs
        id: review_check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const isScheduled = context.eventName === 'schedule';
            let prsToCheck = [];

            if (isScheduled) {
              // Daily run — fetch PRs merged to production branches in last 24 hours
              const since = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
              const { data: pulls } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'closed',
                base: 'main',
                sort: 'updated',
                direction: 'desc',
                per_page: 50
              });
              prsToCheck = pulls.filter(pr =>
                pr.merged_at && new Date(pr.merged_at) >= new Date(since)
              );
            } else {
              // Real-time trigger — single PR
              if (context.payload.pull_request.merged) {
                prsToCheck = [context.payload.pull_request];
              }
            }

            const violations = [];

            for (const pr of prsToCheck) {
              const author   = pr.user.login;
              const prNumber = pr.number;
              const prTitle  = pr.title;
              const prUrl    = pr.html_url;
              const repo     = context.repo.repo;
              const owner    = context.repo.owner;
              const mergedBy = pr.merged_by ? pr.merged_by.login : 'unknown';
              const mergedAt = pr.merged_at;
              const branch   = pr.base.ref;

              const { data: reviews } = await github.rest.pulls.listReviews({
                owner, repo, pull_number: prNumber
              });

              const independentApproval = reviews.find(
                r => r.state === 'APPROVED' && r.user.login !== author
              );
              const selfMerge = mergedBy === author;

              if (!independentApproval || selfMerge) {
                const issues = [];
                if (!independentApproval) issues.push('No independent approval');
                if (selfMerge)           issues.push('Self-merged by PR author');

                let sodCode = 'SOD-01';
                if (selfMerge && !independentApproval) sodCode = 'SOD-02';
                else if (selfMerge)                    sodCode = 'SOD-03';
                else if (!independentApproval)         sodCode = 'SOD-01';

                violations.push({ owner, repo, branch, prNumber, prTitle, prUrl, author, mergedBy, mergedAt, issues, sodCode });
              }
            }

            core.setOutput('violation_count', violations.length.toString());
            core.setOutput('violations', JSON.stringify(violations));
            core.setOutput('is_scheduled', isScheduled.toString());

      - name: Send violations to Slack
        if: steps.review_check.outputs.violation_count > 0
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'C0B8P217Y0P'
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "SOD PR Monitor — Unapproved Production Merges" }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "This report identifies pull requests merged to a production branch in GitHub without an independent review or approval. Company policy requires all production changes to be reviewed and approved by someone other than the author before merging."
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ${{ toJSON(steps.review_check.outputs.violations) }}
                  }
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Send all-clear to Slack
        if: steps.review_check.outputs.violation_count == 0 && steps.review_check.outputs.is_scheduled == 'true'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'C0B8P217Y0P'
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "SOD PR Monitor — Unapproved Production Merges" }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "This report identifies pull requests merged to a production branch in GitHub without an independent review or approval. Company policy requires all production changes to be reviewed and approved by someone other than the author before merging."
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":white_check_mark: *No violations found.* No pull requests were merged to production in the last 24 hours without an independent review or approval."
                  }
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

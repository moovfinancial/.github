name: SOD PR Monitor — CC8.1 Change Management

# Runs daily at 7am CT (13:00 UTC) and checks PRs merged to production
# branches in the last 24 hours. Reports unapproved merges via email.
# Also triggers on any PR merge to production branches in real time.
#
# SOD Codes:
#   SOD-01 — No independent peer approval from a human reviewer
#   SOD-02 — Author self-merged AND no independent peer approval (highest risk)
#   SOD-04 — Peer approval exists but no human review comments found
#             (bare approval click with no evidence of code review)
#
# Compliance basis: SOC 2 CC8.1 | PCI DSS Req 6.5
# A compliant PR requires BOTH:
#   1. An APPROVED review from a human other than the PR author
#   2. At least one human comment (inline diff comment or PR thread comment)
#      from a peer reviewer — evidence that the code was actually read
# Note: self-merge after receiving a valid peer review+approval is NOT a violation.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'  # 7:00 AM CST / 8:00 AM CDT
  pull_request:
    types: [closed]
    branches:
      - main
      - master
      - production
      - release/**

jobs:
  sod-check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read

    steps:
      - name: Check for unapproved or unreviewed merged PRs
        id: review_check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const isScheduled = context.eventName === 'schedule' || context.eventName === 'workflow_dispatch';
            let prsToCheck = [];

            if (isScheduled) {
              const since = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
              const { data: pulls } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'closed',
                base: 'main',
                sort: 'updated',
                direction: 'desc',
                per_page: 50
              });
              prsToCheck = pulls.filter(pr =>
                pr.merged_at && new Date(pr.merged_at) >= new Date(since)
              );
            } else {
              if (context.payload.pull_request.merged) {
                prsToCheck = [context.payload.pull_request];
              }
            }

            // Helper: returns true if a GitHub user is a bot
            const isBot = (user) =>
              user.type === 'Bot' ||
              user.login.endsWith('[bot]') ||
              user.login.includes('-bot') ||
              user.login.includes('bot-');

            const violations = [];

            for (const pr of prsToCheck) {
              const author   = pr.user.login;
              const prNumber = pr.number;
              const prTitle  = pr.title;
              const prUrl    = pr.html_url;
              const repo     = context.repo.repo;
              const owner    = context.repo.owner;
              const mergedBy = pr.merged_by ? pr.merged_by.login : 'unknown';
              const mergedAt = pr.merged_at;
              const branch   = pr.base.ref;

              // --- Check 1: Independent peer approval ---
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner, repo, pull_number: prNumber
              });

              const peerApprovals = reviews.filter(
                r => r.state === 'APPROVED' &&
                     r.user.login !== author &&
                     !isBot(r.user)
              );
              const hasIndependentApproval = peerApprovals.length > 0;

              if (!hasIndependentApproval) {
                // No peer approval at all — SOD-01 or SOD-02
                const selfMerge = mergedBy === author;
                const issues = ['No independent peer approval found in GitHub'];
                if (selfMerge) issues.push('Self-merged by PR author');
                const sodCode = selfMerge ? 'SOD-02' : 'SOD-01';
                violations.push({ owner, repo, branch, prNumber, prTitle, prUrl, author, mergedBy, mergedAt, issues, sodCode });
                continue;
              }

              // --- Check 2: Evidence of human review (comments) ---
              // Fetch inline diff comments and general PR thread comments
              const [{ data: inlineComments }, { data: generalComments }] = await Promise.all([
                github.rest.pulls.listReviewComments({ owner, repo, pull_number: prNumber }),
                github.rest.issues.listComments({ owner, repo, issue_number: prNumber })
              ]);

              // Only count human comments from someone other than the PR author
              const humanPeerInlineComments = inlineComments.filter(
                c => c.user.login !== author && !isBot(c.user)
              );
              const humanPeerGeneralComments = generalComments.filter(
                c => c.user.login !== author && !isBot(c.user)
              );

              // Also count non-empty review bodies from peer approvers as review evidence
              const reviewBodiesWithContent = peerApprovals.filter(
                r => r.body && r.body.trim().length > 0
              );

              const hasReviewEvidence =
                humanPeerInlineComments.length > 0 ||
                humanPeerGeneralComments.length > 0 ||
                reviewBodiesWithContent.length > 0;

              if (!hasReviewEvidence) {
                // Peer approved but left no comments — bare approval, no review evidence
                const approverLogins = peerApprovals.map(r => r.user.login).join(', ');
                violations.push({
                  owner, repo, branch, prNumber, prTitle, prUrl, author, mergedBy, mergedAt,
                  issues: [
                    `Peer approval exists (${approverLogins}) but no human review comments found`,
                    'Approval without documented review evidence does not satisfy SOC 2 CC8.1 / PCI DSS Req 6.5'
                  ],
                  sodCode: 'SOD-04'
                });
              }
              // else: has both approval and review evidence — compliant, no violation
            }

            let violationText = '';
            let subjectLine = '';
            const date = new Date().toISOString().split('T')[0];

            if (violations.length > 0) {
              subjectLine = `SOD Violation — ${violations.length} Unreviewed/Unapproved Production Merge(s) Detected — ${date}`;
              violationText =
                `SOD PR Monitor — Unreviewed/Unapproved Production Merges\n` +
                `================================================================\n\n` +
                `This report identifies pull requests merged to a production branch that did not meet Moov's change management requirements. A compliant production merge requires BOTH:\n\n` +
                `  1. An approved review from a human peer (someone other than the PR author)\n` +
                `  2. Evidence of review — at least one human comment on the PR (inline code\n` +
                `     comment or PR thread comment) from someone other than the author\n\n` +
                `Self-merge after receiving a valid peer review and approval is NOT a violation.\n\n` +
                `SOD Codes:\n` +
                `  SOD-01 — No independent peer approval (merged by someone other than author)\n` +
                `  SOD-02 — No independent peer approval AND self-merged by author (highest risk)\n` +
                `  SOD-04 — Peer approval exists but no human review comments found\n\n` +
                `For each finding, take one of the following actions:\n` +
                `  SOD-01/02: Obtain a retroactive peer review and approval on the GitHub PR,\n` +
                `             or escalate to your manager and the security team immediately.\n` +
                `  SOD-04:    Have the approver add a review comment to the GitHub PR confirming\n` +
                `             they reviewed the change, or document an exception in the GRC system.\n\n` +
                `================================================================\n\n` +
                violations.map((v, i) => [
                  `Finding ${i + 1} of ${violations.length}`,
                  `Repo:      ${v.owner}/${v.repo}`,
                  `Branch:    ${v.branch}`,
                  `PR:        #${v.prNumber} — ${v.prTitle}`,
                  `URL:       ${v.prUrl}`,
                  `Author:    ${v.author}`,
                  `Merged By: ${v.mergedBy}`,
                  `Merged At: ${v.mergedAt}`,
                  `Issue(s):  ${v.issues.join('\n           ')}`,
                  `SOD Code:  ${v.sodCode}`
                ].join('\n')).join('\n\n---\n\n') +
                `\n\n================================================================\n` +
                `SOC 2 CC8.1 | PCI DSS Req 6.5 | Generated by SOD PR Monitor`;
            } else {
              subjectLine = `SOD PR Monitor — No Violations Found — ${date}`;
              violationText =
                `SOD PR Monitor — Unreviewed/Unapproved Production Merges\n` +
                `================================================================\n\n` +
                `This report identifies pull requests merged to a production branch that did not meet Moov's change management requirements. A compliant production merge requires BOTH:\n\n` +
                `  1. An approved review from a human peer (someone other than the PR author)\n` +
                `  2. Evidence of review — at least one human comment on the PR (inline code\n` +
                `     comment or PR thread comment) from someone other than the author\n\n` +
                `No violations found. All pull requests merged to production in the last 24 hours\n` +
                `had both a peer approval and documented review evidence in GitHub.\n\n` +
                `No action required.\n\n` +
                `================================================================\n` +
                `SOC 2 CC8.1 | PCI DSS Req 6.5 | Generated by SOD PR Monitor`;
            }

            core.setOutput('violation_count', violations.length.toString());
            core.setOutput('violation_text', violationText);
            core.setOutput('subject', subjectLine);
            core.setOutput('is_scheduled', isScheduled.toString());

      - name: Send email report
        if: steps.review_check.outputs.is_scheduled == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SOD_GMAIL_ADDRESS }}
          password: ${{ secrets.SOD_GMAIL_APP_PASSWORD }}
          to: mark.drozd@moov.io
          from: SOD PR Monitor <${{ secrets.SOD_GMAIL_ADDRESS }}>
          subject: ${{ steps.review_check.outputs.subject }}
          body: ${{ steps.review_check.outputs.violation_text }}

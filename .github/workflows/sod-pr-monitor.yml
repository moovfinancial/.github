name: SOD PR Monitor — CC8.1 Change Management

# Runs daily at 7am CT (13:00 UTC) and checks PRs merged to production
# branches in the last 24 hours. Reports unapproved merges via email.
# Also triggers on any PR merge to production branches in real time.
#
# SOD Codes:
#   SOD-01 — No independent peer approval (merged by someone other than author)
#   SOD-02 — No independent peer approval AND self-merged by author (highest risk)
#
# Compliance basis: SOC 2 CC8.1 | PCI DSS Req 6.5
# A compliant PR requires:
#   1. An APPROVED review from a human peer (not the PR author, not a bot)
# Note: self-merge after receiving a valid peer approval is NOT a violation.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'  # 7:00 AM CST / 8:00 AM CDT
  pull_request:
    types: [closed]
    branches:
      - main
      - master
      - production
      - release/**

jobs:
  sod-check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read

    steps:
      - name: Check for unapproved merged PRs
        id: review_check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const isScheduled = context.eventName === 'schedule' || context.eventName === 'workflow_dispatch';
            let prsToCheck = [];

            if (isScheduled) {
              const since = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
              const { data: pulls } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'closed',
                base: 'main',
                sort: 'updated',
                direction: 'desc',
                per_page: 50
              });
              prsToCheck = pulls.filter(pr =>
                pr.merged_at && new Date(pr.merged_at) >= new Date(since)
              );
            } else {
              if (context.payload.pull_request.merged) {
                prsToCheck = [context.payload.pull_request];
              }
            }

            // Helper: returns true if a GitHub user is a bot
            const isBot = (user) =>
              user.type === 'Bot' ||
              user.login.endsWith('[bot]') ||
              user.login.includes('-bot') ||
              user.login.startsWith('bot-');

            const violations = [];

            for (const pr of prsToCheck) {
              const author   = pr.user.login;
              const prNumber = pr.number;
              const prTitle  = pr.title;
              const prUrl    = pr.html_url;
              const repo     = context.repo.repo;
              const owner    = context.repo.owner;
              const mergedBy = pr.merged_by ? pr.merged_by.login : 'unknown';
              const mergedAt = pr.merged_at;
              const branch   = pr.base.ref;

              const { data: reviews } = await github.rest.pulls.listReviews({
                owner, repo, pull_number: prNumber
              });

              // A compliant PR needs at least one APPROVED review from a human
              // who is not the PR author. Who clicked merge does not matter.
              const hasIndependentApproval = reviews.some(
                r => r.state === 'APPROVED' &&
                     r.user.login !== author &&
                     !isBot(r.user)
              );

              if (!hasIndependentApproval) {
                const selfMerge = mergedBy === author;
                const issues = ['No independent peer approval found in GitHub'];
                if (selfMerge) issues.push('Self-merged by PR author');
                const sodCode = selfMerge ? 'SOD-02' : 'SOD-01';
                violations.push({
                  owner, repo, branch, prNumber, prTitle, prUrl,
                  author, mergedBy, mergedAt, issues, sodCode
                });
              }
            }

            let violationText = '';
            let subjectLine = '';
            const date = new Date().toISOString().split('T')[0];

            if (violations.length > 0) {
              subjectLine = `SOD Violation — ${violations.length} Unapproved Production Merge(s) Detected — ${date}`;
              violationText =
                `SOD PR Monitor — Unapproved Production Merges\n` +
                `================================================================\n\n` +
                `This report identifies pull requests merged to a production branch in GitHub without an independent peer approval. Company policy requires all production changes to be approved by someone other than the PR author before merging.\n\n` +
                `Self-merge after receiving a valid peer approval is NOT a violation — only PRs with no documented independent approval in GitHub appear in this report.\n\n` +
                `SOD Codes:\n` +
                `  SOD-01 — No peer approval; merged by someone other than the author\n` +
                `  SOD-02 — No peer approval AND self-merged by author (highest risk)\n\n` +
                `For each finding, take one of the following actions:\n` +
                `  1. Obtain a retroactive peer approval on the GitHub PR before the audit window closes.\n` +
                `  2. If the change was genuinely unreviewed — escalate to your manager and the security team immediately.\n\n` +
                `================================================================\n\n` +
                violations.map((v, i) => [
                  `Finding ${i + 1} of ${violations.length}`,
                  `Repo:      ${v.owner}/${v.repo}`,
                  `Branch:    ${v.branch}`,
                  `PR:        #${v.prNumber} — ${v.prTitle}`,
                  `URL:       ${v.prUrl}`,
                  `Author:    ${v.author}`,
                  `Merged By: ${v.mergedBy}`,
                  `Merged At: ${v.mergedAt}`,
                  `Issue(s):  ${v.issues.join(', ')}`,
                  `SOD Code:  ${v.sodCode}`
                ].join('\n')).join('\n\n---\n\n') +
                `\n\n================================================================\n` +
                `SOC 2 CC8.1 | PCI DSS Req 6.5 | Generated by SOD PR Monitor`;
            } else {
              subjectLine = `SOD PR Monitor — No Violations Found — ${date}`;
              violationText =
                `SOD PR Monitor — Unapproved Production Merges\n` +
                `================================================================\n\n` +
                `This report identifies pull requests merged to a production branch in GitHub without an independent peer approval. Company policy requires all production changes to be approved by someone other than the PR author before merging.\n\n` +
                `No violations found. All pull requests merged to production in the last 24 hours had an independent peer approval documented in GitHub.\n\n` +
                `No action required.\n\n` +
                `================================================================\n` +
                `SOC 2 CC8.1 | PCI DSS Req 6.5 | Generated by SOD PR Monitor`;
            }

            core.setOutput('violation_count', violations.length.toString());
            core.setOutput('violation_text', violationText);
            core.setOutput('subject', subjectLine);
            core.setOutput('is_scheduled', isScheduled.toString());

      - name: Send email report
        if: steps.review_check.outputs.is_scheduled == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SOD_GMAIL_ADDRESS }}
          password: ${{ secrets.SOD_GMAIL_APP_PASSWORD }}
          to: mark.drozd@moov.io
          from: SOD PR Monitor <${{ secrets.SOD_GMAIL_ADDRESS }}>
          subject: ${{ steps.review_check.outputs.subject }}
          body: ${{ steps.review_check.outputs.violation_text }}
